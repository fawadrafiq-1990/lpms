server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # MIME types
    include /etc/nginx/mime.types;

    # ------------------------------------------------------------------
    # Rate limiting zone (define in http{} block of nginx.conf normally)
    # ------------------------------------------------------------------

    # ------------------------------------------------------------------
    # Compression — Brotli (preferred) then gzip
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        text/xml
        image/svg+xml
        font/woff
        font/woff2;

    # Brotli (requires ngx_brotli or brotli module)
    # Uncomment if using official nginx with brotli module:
    # brotli on;
    # brotli_comp_level 6;
    # brotli_min_length 256;
    # brotli_types (same as gzip_types above);

    # Prefer pre-compressed files if client supports them
    # gunzip is not available in alpine, removing this directive

    # ------------------------------------------------------------------
    # Security headers
    # ------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN"                  always;
    add_header X-Content-Type-Options "nosniff"              always;
    add_header X-XSS-Protection "1; mode=block"              always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://backend:8080 ws://backend:8080 wss://backend:8080; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ------------------------------------------------------------------
    # API reverse-proxy
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_cache_bypass                 $http_upgrade;

        # Timeouts
        proxy_connect_timeout 75s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Buffering
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;

        # Hide nginx version in error pages
        proxy_intercept_errors on;
    }

    # ------------------------------------------------------------------
    # WebSocket endpoint
    # ------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout                  86400s;
    }

    # ------------------------------------------------------------------
    # Static asset serving — SPA fallback
    # ------------------------------------------------------------------
    location ~* \.(js)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Content-Type "application/javascript" always;
        add_header Vary "Accept-Encoding" always;
        try_files $uri =404;
        access_log off;
    }

    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Vary "Accept-Encoding" always;
        try_files $uri =404;
        access_log off;
    }

    # SPA routing — all other requests serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ------------------------------------------------------------------
    # Deny access to hidden files
    # ------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ------------------------------------------------------------------
    # Custom error pages (if desired)
    # ------------------------------------------------------------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

###############################################################################
# Ingress — LPMS external access with TLS
#
# Prerequisites:
#   - NGINX Ingress Controller (or equivalent) installed in the cluster
#   - cert-manager installed for automatic TLS certificate management
#
# Apply:  kubectl apply -f ingress.yaml
###############################################################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lpms-ingress
  namespace: lpms
  labels:
    app.kubernetes.io/name: lpms
    app.kubernetes.io/component: ingress
  annotations:
    # ------------------------------------------------------------------
    # Ingress controller (NGINX)
    # ------------------------------------------------------------------
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "75"

    # ------------------------------------------------------------------
    # SSL / TLS
    # ------------------------------------------------------------------
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"

    # ------------------------------------------------------------------
    # cert-manager (automatic certificate provisioning)
    # ------------------------------------------------------------------
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # ------------------------------------------------------------------
    # Security headers
    # ------------------------------------------------------------------
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ------------------------------------------------------------------
    # Rate limiting (optional — adjust to your needs)
    # ------------------------------------------------------------------
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - lpms.example.com
      secretName: lpms-tls-secret
  rules:
    # ---------------------------------------------------------------
    # Frontend — serves React SPA
    # ---------------------------------------------------------------
    - host: lpms.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lpms-frontend
                port:
                  number: 80

    # ---------------------------------------------------------------
    # Backend API — proxied through frontend nginx, or direct access
    # ---------------------------------------------------------------
    - host: lpms.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: lpms-backend
                port:
                  number: 8080

          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: lpms-backend
                port:
                  number: 8080
---
###############################################################################
# Optional: Separate API host (uncomment if you want api.lpms.example.com)

apiVersion: v1
kind: Service
metadata:
  name: lpms-mysql
  namespace: lpms
  labels:
    app.kubernetes.io/name: lpms
    app.kubernetes.io/component: mysql
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
  selector:
    app.kubernetes.io/name: lpms
    app.kubernetes.io/component: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lpms-mysql
  namespace: lpms
  labels:
    app.kubernetes.io/name: lpms
    app.kubernetes.io/component: mysql
spec:
  serviceName: lpms-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lpms
      app.kubernetes.io/component: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lpms
        app.kubernetes.io/component: mysql
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          envFrom:
            - configMapRef:
                name: lpms-config
            - secretRef:
                name: lpms-secrets
          command:
            - mysqld
            - --default-authentication-plugin=caching_sha2_password
            - "--character-set-server=$(MYSQL_CHARACTER_SET)"
            - "--collation-server=$(MYSQL_COLLATION)"
            - "--max-connections=$(MYSQL_MAX_CONNECTIONS)"
            - "--innodb-buffer-pool-size=$(MYSQL_INNODB_BUFFER_POOL_SIZE)"
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -u
                - root
                - -p$(MYSQL_ROOT_PASSWORD)
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -u
                - root
                - -p$(MYSQL_ROOT_PASSWORD)
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
        storageClassName: standard

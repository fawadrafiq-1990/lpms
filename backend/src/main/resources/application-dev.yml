# ============================================================
# Development Profile Configuration
# Connects to Docker infrastructure services on published ports
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/lpms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: lpms
    password: lpms_secure_password

  data:
    redis:
      host: localhost
      port: 6380
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2
          max-wait: 3000ms

  elasticsearch:
    uris: http://localhost:9200

  kafka:
    bootstrap-servers: localhost:9093
    consumer:
      group-id: lpms-dev-group

# AI/LLM - uses existing ollama on port 11434
app:
  ai:
    provider: ollama
    base-url: http://localhost:11434

  multi-tenant:
    enabled: true
    mode: schema

server:
  port: 8080

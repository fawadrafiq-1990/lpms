server:
  port: 0

spring:
  application:
    name: legal-management-system-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost
    port: 25

  task:
    execution:
      pool:
        core-size: 2
        max-size: 5
      queue-capacity: 100

app:
  jwt:
    secret: dGhpcy1pcy1hLXNpbXVsYXRlZC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLXB1cnBvc2VzLW9ubHk
    expiration: 86400000
    refresh-expiration: 604800000

  storage:
    type: local
    local:
      path: /tmp/legal-storage

  ai:
    provider: mock
    model: mock-model
    base-url: http://localhost:11434

logging:
  level:
    root: WARN
    com.company.legal: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

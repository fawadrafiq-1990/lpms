###############################################################################
# Secrets — Template for sensitive LPMS credentials
#
# WARNING: Do NOT commit real secrets to version control.
# Replace the base64 placeholders with actual encoded values, or use an
# external secrets manager (Vault, AWS Secrets Manager, etc.).
#
# To encode a value:  echo -n 'your-value' | base64
#
# Recommended: Delete this file in production and use:
#   - External Secrets Operator
#   - Sealed Secrets
#   - Helm secrets (--set-file)
#   - Kubernetes secret generators (kubectl create secret ...)
###############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: lpms-secrets
  namespace: lpms
  labels:
    app.kubernetes.io/name: lpms
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # ---------------------------------------------------------------
  # Database credentials
  # ---------------------------------------------------------------
  MYSQL_ROOT_PASSWORD: "CHANGE-ME-generate-strong-password"
  DB_USERNAME: "lpms"
  DB_PASSWORD: "CHANGE-ME-generate-strong-password"

  # ---------------------------------------------------------------
  # Redis password
  # ---------------------------------------------------------------
  REDIS_PASSWORD: "CHANGE-ME-generate-strong-password"

  # ---------------------------------------------------------------
  # Mail credentials
  # ---------------------------------------------------------------
  MAIL_USERNAME: "CHANGE-ME-your-smtp-username"
  MAIL_PASSWORD: "CHANGE-ME-your-smtp-password"

  # ---------------------------------------------------------------
  # JWT signing key (minimum 32 characters for HS256)
  # ---------------------------------------------------------------
  JWT_SECRET: "CHANGE-ME-generate-a-256-bit-random-secret-key-here"

  # ---------------------------------------------------------------
  # LLM API key (if using external provider)
  # ---------------------------------------------------------------
  LLM_API_KEY: ""

  # ---------------------------------------------------------------
  # S3 credentials (optional — for cloud storage)
  # ---------------------------------------------------------------
  S3_BUCKET: ""
  S3_REGION: ""
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""

  # ---------------------------------------------------------------
  # Elasticsearch credentials (optional — if xpack enabled)
  # ---------------------------------------------------------------
  ELASTICSEARCH_USERNAME: ""
  ELASTICSEARCH_PASSWORD: ""
